spring.application.name=tienda-parking
server.port=8080

# Configuración de Base de Datos MySQL Real (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/tienda_parking?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# Desactivar scripts iniciales para operar exclusivamente con MySQL real
spring.sql.init.mode=never

# Thymeleaf caching (desactivado para desarrollo)
spring.thymeleaf.cache=false

# Logging
logging.level.com.tiendaparking=INFO
