<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pasajeros - Tienda Parking</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <nav class="navbar">
        <a th:href="@{/}" class="navbar-brand">
            🚗 Tienda Parking
        </a>
        <ul class="nav-links">
            <li><a th:href="@{/}">Dashboard</a></li>
            <li><a th:href="@{/choferes}">Choferes</a></li>
            <li><a th:href="@{/carros}">Carros</a></li>
            <li><a th:href="@{/motores}">Motores</a></li>
            <li><a th:href="@{/pasajeros}" class="active">Pasajeros</a></li>
        </ul>
    </nav>

    <main class="container">
        <header class="page-header">
            <h1>Gestión de Pasajeros</h1>
            <p>Lista y registro de pasajeros</p>
        </header>

        <section class="content-grid">
            <article class="card">
                <h2 class="card-title">Pasajeros Registrados</h2>
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Cédula</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="pasajero : ${pasajeros}">
                            <td th:text="${pasajero.nombre}">Nombre</td>
                            <td th:text="${pasajero.apellido}">Apellido</td>
                            <td th:text="${pasajero.cedula}">123456789</td>
                        </tr>
                    </tbody>
                </table>
            </article>

            <article class="card">
                <h2 class="card-title">Registrar Nuevo Pasajero</h2>
                <form th:action="@{/pasajeros}" th:object="${nuevoPasajero}" method="post">
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" th:field="*{nombre}" class="form-control" required placeholder="Ej: Ana"
                               pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]+" title="Solo se permiten letras"
                               oninput="this.value = this.value.replace(/[^A-Za-záéíóúÁÉÍÓÚñÑ\s]/g, '')">
                    </div>
                    <div class="form-group">
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" th:field="*{apellido}" class="form-control" required placeholder="Ej: Gomez"
                               pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]+" title="Solo se permiten letras"
                               oninput="this.value = this.value.replace(/[^A-Za-záéíóúÁÉÍÓÚñÑ\s]/g, '')">
                    </div>
                    <div class="form-group">
                        <label for="cedula">Cédula</label>
                        <input type="text" id="cedula" th:field="*{cedula}" class="form-control" required placeholder="Ej: 456789012"
                               pattern="[0-9]+" title="Solo se permiten números"
                               oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                    </div>
                    <button type="submit" class="btn">Guardar Pasajero</button>
                </form>
            </article>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Sistema Tienda Parking - Spring Boot MVC en XAMPP</p>
    </footer>

</body>
</html>
